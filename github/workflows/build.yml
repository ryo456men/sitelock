name: Build SiteLock APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create the Android project
        run: |
          mkdir -p app/src/main/java/com/example/sitelock/vpn app/src/main/res/layout
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SiteLock"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.sitelock'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.sitelock"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "0.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_lock_idle_lock"
                  android:label="SiteLock"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".vpn.BlockerVpnService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="SiteLock"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <EditText
                  android:id="@+id/etDomain"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:hint="e.g. tiktok.com"
                  android:inputType="textUri" />

              <Button
                  android:id="@+id/btnBlock"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Block for 6 months" />

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Start blocking (VPN)" />

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Stop" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Blocked sites stay blocked for at least 6 months."
                  android:textSize="12sp" />
          </LinearLayout>
          EOF
          cat > app/src/main/java/com/example/sitelock/MainActivity.kt <<'EOF'
          package com.example.sitelock

          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import com.example.sitelock.vpn.BlockerVpnService

          class MainActivity : AppCompatActivity() {

              private val vpnLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK) startService(vpnIntent())
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etDomain = findViewById<EditText>(R.id.etDomain)

                  findViewById<Button>(R.id.btnBlock).setOnClickListener {
                      val domain = etDomain.text.toString().trim().lowercase()
                      if (domain.isEmpty()) return@setOnClickListener
                      Blocklist.block(this, domain)
                      Toast.makeText(this, "$domain blocked for 6 months", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      // Android asks the user for VPN permission the first time
                      val check = VpnService.prepare(this)
                      if (check != null) vpnLauncher.launch(check) else startService(vpnIntent())
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(vpnIntent())
                  }
              }

              private fun vpnIntent() = Intent(this, BlockerVpnService::class.java)
          }
          EOF
          cat > app/src/main/java/com/example/sitelock/Blocklist.kt <<'EOF'
          package com.example.sitelock

          import android.content.Context

          // The 6-month rule lives here - every part of the app asks THIS object first.
          object Blocklist {
              private const val SIX_MONTHS_MS = 183L * 24 * 60 * 60 * 1000  // ~6 months

              private fun prefs(ctx: Context) =
                  ctx.getSharedPreferences("blocklist", Context.MODE_PRIVATE)

              fun block(ctx: Context, domain: String) {
                  prefs(ctx).edit().putLong(domain.lowercase(), System.currentTimeMillis()).apply()
              }

              // blocks subdomains too: blocking "tiktok.com" also kills "www.tiktok.com"
              fun isBlocked(ctx: Context, domain: String): Boolean {
                  var d = domain.lowercase()
                  while (d.isNotEmpty()) {
                      if (prefs(ctx).contains(d)) return true
                      d = d.substringAfter('.', "")
                  }
                  return false
              }

              fun canUnblock(ctx: Context, domain: String): Boolean =
                  System.currentTimeMillis() - prefs(ctx).getLong(domain.lowercase(), 0) >= SIX_MONTHS_MS

              // Returns true ONLY if 6 months have passed. Otherwise: refused, no exceptions.
              fun requestUnblock(ctx: Context, domain: String): Boolean {
                  if (!canUnblock(ctx, domain)) return false
                  prefs(ctx).edit().remove(domain.lowercase()).apply()
                  return true
              }
          }
          EOF
          cat > app/src/main/java/com/example/sitelock/vpn/Packet.kt <<'EOF'
          package com.example.sitelock.vpn

          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          // Minimal IPv4/UDP packet reader + DNS reply builder
          class Packet(private val b: ByteArray, val len: Int) {
              private val ipHLen = (b[0].toInt() and 0x0F) * 4
              private val udp = ipHLen
              private val dns = udp + 8
              val srcPort = u16(udp)
              val dstIp = b.copyOfRange(16, 20)
              private val srcIp = b.copyOfRange(12, 16)

              fun isUdpToPort(port: Int): Boolean =
                  len >= dns && (b[9].toInt() and 0xFF) == 17 && u16(udp + 2) == port

              fun dnsPayload(): ByteArray = b.copyOfRange(dns, len)

              fun queryDomain(): String? = try {
                  val parts = ArrayList<String>()
                  var off = dns + 12 // skip the 12-byte DNS header
                  while (off < len) {
                      val l = b[off].toInt()
                      if (l == 0) break
                      parts.add(String(b, off + 1, l, Charsets.US_ASCII))
                      off += 1 + l
                  }
                  parts.joinToString(".")
              } catch (t: Throwable) { null }

              // Build an IPv4/UDP packet from dstIp:53 back to the phone.
              // payload = real DNS answer to forward, or null = fake NXDOMAIN reply.
              fun buildDnsReply(payload: ByteArray? = null): ByteArray {
                  val question = b.copyOfRange(dns + 12, len) // QNAME + QTYPE + QCLASS
                  val body: ByteArray = payload ?: ByteArray(12 + question.size).also { out ->
                      val bb = ByteBuffer.wrap(out).order(ByteOrder.BIG_ENDIAN)
                      bb.put(b, dns, 2)                    // copy query ID
                      bb.putShort(0x8183.toShort())        // QR=1, RD, RA, RCODE=3 (NXDOMAIN)
                      bb.putShort(1); bb.putShort(0); bb.putShort(0); bb.putShort(0)
                      bb.put(question)
                  }
                  val total = 20 + 8 + body.size
                  val out = ByteArray(total)
                  val o = ByteBuffer.wrap(out).order(ByteOrder.BIG_ENDIAN)
                  o.put(0x45); o.put(0)
                  o.putShort(total.toShort()); o.putShort(0); o.putShort(0)
                  o.put(64); o.put(17.toByte()); o.putShort(0)  // IPv4, TTL 64, UDP, checksum later
                  o.put(dstIp); o.put(srcIp)
                  o.putShort(53.toShort()); o.putShort(srcPort.toShort())
                  o.putShort((8 + body.size).toShort()); o.putShort(0) // UDP checksum 0 is legal in IPv4
                  o.put(body)
                  fixIpChecksum(out)
                  return out
              }

              private fun fixIpChecksum(p: ByteArray) {
                  var sum = 0
                  for (i in 0 until 20 step 2) sum += ((p[i].toInt() and 0xFF) shl 8) or (p[i + 1].toInt() and 0xFF)
                  while (sum ushr 16 != 0) sum = (sum and 0xFFFF) + (sum ushr 16)
                  val c = sum.inv() and 0xFFFF
                  p[10] = (c ushr 8).toByte(); p[11] = (c and 0xFF).toByte()
              }

              private fun u16(off: Int) = ((b[off].toInt() and 0xFF) shl 8) or (b[off + 1].toInt() and 0xFF)
          }
          EOF
          cat > app/src/main/java/com/example/sitelock/vpn/BlockerVpnService.kt <<'EOF'
          package com.example.sitelock.vpn

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import com.example.sitelock.Blocklist
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import kotlin.concurrent.thread

          class BlockerVpnService : VpnService() {

              private var tun: ParcelFileDescriptor? = null
              @Volatile private var running = false

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground()
                  running = true
                  tun = Builder()
                      .setSession("SiteLock")
                      .setMtu(1500)
                      .addAddress("10.0.0.2", 32)
                      .addRoute("8.8.8.8", 32)   // only DNS traffic gets pulled into the tunnel
                      .addRoute("1.1.1.1", 32)
                      .addRoute("9.9.9.9", 32)
                      .addDnsServer("8.8.8.8")
                      .setBlocking(true)
                      .establish()
                  val pfd = tun ?: return START_STICKY
                  thread { runLoop(pfd) }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  tun?.close()
              }

              private fun runLoop(pfd: ParcelFileDescriptor) {
                  val input = FileInputStream(pfd.fileDescriptor)
                  val output = FileOutputStream(pfd.fileDescriptor)
                  val buf = ByteArray(4096)
                  while (running) {
                      val n = try { input.read(buf) } catch (t: Throwable) { break }
                      if (n <= 0) break
                      val pkt = Packet(buf, n)
                      if (!pkt.isUdpToPort(53)) continue
                      val domain = pkt.queryDomain() ?: continue
                      val reply: ByteArray? = if (Blocklist.isBlocked(this, domain)) {
                          pkt.buildDnsReply()              // fake NXDOMAIN = site does not exist
                      } else {
                          forward(pkt)                     // allowed: ask the real DNS server
                      }
                      reply?.let { output.write(it) }
                  }
              }

              // Ask the real DNS server, then wrap its answer back into an IP packet
              private fun forward(pkt: Packet): ByteArray? = try {
                  val socket = DatagramSocket()
                  protect(socket) // MUST bypass the VPN or we deadlock ourselves
                  socket.soTimeout = 4000
                  val server = InetAddress.getByAddress(pkt.dstIp)
                  socket.send(DatagramPacket(pkt.dnsPayload(), pkt.dnsPayload().size, server, 53))
                  val r = ByteArray(4096)
                  val rp = DatagramPacket(r, r.size)
                  socket.receive(rp)
                  socket.close()
                  pkt.buildDnsReply(payload = r.copyOfRange(0, rp.length))
              } catch (t: Throwable) { null }

              private fun startForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("vpn", "SiteLock", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "vpn")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentTitle("SiteLock is active")
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }
          }
          EOF

      - name: Build the APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sitelock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
